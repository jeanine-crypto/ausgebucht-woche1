<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modul 3 · Deine tiefste Wahrheit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#F6F1E8; --ink:#0B243C; --accent:#E8176A; --mauve:#C49080; --line:#E4D9C8; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Source Sans 3",system-ui,sans-serif; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:680px; margin:0 auto; padding:32px 22px 64px; }
  .brand { letter-spacing:.18em; text-transform:uppercase; font-size:13px; font-weight:600; color:var(--mauve); }
  h1 { font-family:"Tenor Sans",serif; font-weight:400; font-size:34px; line-height:1.15; margin:6px 0 4px; }
  .sub { font-size:16px; opacity:.75; margin:0 0 20px; }

  .intro { background:#FCF8F1; border-left:4px solid var(--accent); border-radius:0 14px 14px 0; padding:18px 20px; margin:0 0 28px; font-size:16.5px; line-height:1.65; }
  .intro strong { color:var(--accent); }

  .gate { display:none; background:#FFF; border:1px solid var(--line); border-radius:18px; padding:34px 26px; text-align:center; }
  .gate.show { display:block; }
  .gate .icon { font-size:34px; }
  .gate a { display:inline-block; margin-top:16px; background:var(--accent); color:#fff; text-decoration:none; padding:13px 24px; border-radius:12px; font-weight:700; }

  .app { display:none; }
  .app.show { display:block; }

  .q { background:#FFF; border:1px solid var(--line); border-radius:18px; padding:22px 20px; margin-bottom:20px; box-shadow:0 8px 24px rgba(11,36,60,.05); }
  .q label { display:block; font-family:"Tenor Sans",serif; font-size:20px; margin:0 0 12px; line-height:1.3; }
  textarea { width:100%; min-height:110px; padding:13px 15px; border-radius:12px; border:1.5px solid var(--line); background:#FBF7F0; color:var(--ink); font-family:inherit; font-size:16px; resize:vertical; }

  .btn { width:100%; padding:16px 22px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-family:inherit; font-weight:700; font-size:17px; cursor:pointer; box-shadow:0 8px 22px rgba(232,23,106,.28); transition:transform .06s; }
  .btn:hover { transform:translateY(-1px); }
  .btn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; transform:none; }

  .msg { margin-top:16px; padding:13px 16px; border-radius:12px; font-size:15px; display:none; }
  .msg.err { display:block; background:#FDE7EF; color:#9B0E45; border:1px solid #F6B8CF; }
  .msg.ok { display:block; background:#E7F6EC; color:#0E6B33; border:1px solid #B6E2C4; }
  .loading { display:none; align-items:center; gap:12px; margin-top:16px; }
  .loading.show { display:flex; }
  .dot { width:13px; height:13px; border-radius:50%; background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(.75);opacity:.5} 50%{transform:scale(1.15);opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Reich &amp; Ehrlich</div>
  <h1>Modul 3 · Deine tiefste Wahrheit</h1>
  <div class="sub">Was weißt Du, das andere nicht sehen wollen?</div>

  <div class="gate" id="gate">
    <div class="icon">📌</div>
    <div style="font-weight:600;margin-top:8px;font-size:19px">Mach zuerst Modul 2</div>
    <a id="gate-link" href="#">Zu Modul 2</a>
  </div>

  <div class="app" id="app">
    <div class="intro">
      Jeanine glaubt: Es ist einfacher als alle denken. <strong>Be You. Be True. Make Millions.</strong>
      Das ist ihre eine Überzeugung. Was ist Deine?
    </div>

    <div class="q">
      <label>Was ist Deine tiefste Wahrheit, die Deine Business Branche anders sieht?</label>
      <textarea id="q1" placeholder="Die Wahrheit die Du kennst, die andere nicht sehen wollen..."></textarea>
    </div>

    <div class="q">
      <label>Was ist eine Sache, die Du auf jeden Fall hier hinterlassen willst?</label>
      <textarea id="q2" placeholder="Dein Be You. Be True. Make Millions..."></textarea>
    </div>

    <button class="btn" id="save">Speichern &amp; zur Auswertung</button>
    <div class="loading" id="loading"><span class="dot"></span><span>Wird gespeichert...</span></div>
    <div class="msg err" id="error"></div>
    <div class="msg ok" id="okmsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const CFG = window.AUSGEBUCHT_CONFIG;
  let _sb = null;
  function getClient() {
    if (_sb) return _sb;
    if (!CFG || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.indexOf("http") !== 0) {
      throw new Error("config.js ist noch nicht ausgefüllt (SUPABASE_URL fehlt).");
    }
    _sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    return _sb;
  }
  async function readFnError(error) {
    try {
      if (error && error.context && typeof error.context.json === "function") {
        const body = await error.context.json();
        if (body && body.error) return body.error;
      }
    } catch (_) {}
    return (error && error.message) || "Funktion fehlgeschlagen";
  }
  const params = new URLSearchParams(window.location.search);
  const email = (params.get("email") || "").trim();

  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  document.getElementById("gate-link").href = "modul2.html?email=" + encodeURIComponent(email);

  const errBox = document.getElementById("error");
  const okBox = document.getElementById("okmsg");
  function showError(t){ errBox.textContent=t; errBox.style.display="block"; okBox.style.display="none"; }

  async function init() {
    if (!email) { app.classList.add("show"); showError("Kein E-Mail Parameter gefunden. Öffne das Modul über Kajabi."); return; }
    try {
      const sb = getClient();
      const { data, error } = await sb.functions.invoke("Module3", { body: { email: email, action: "status" } });
      if (error) throw error;
      const row = (data && data.data) || data;
      if (row && row.modul2_fertig) app.classList.add("show");
      else gate.classList.add("show");
    } catch (e) { app.classList.add("show"); }
  }

  document.getElementById("save").addEventListener("click", async function () {
    errBox.style.display="none"; okBox.style.display="none";
    const q1 = document.getElementById("q1").value.trim();
    const q2 = document.getElementById("q2").value.trim();
    if (!q1 || !q2) { showError("Bitte beantworte beide Fragen."); return; }

    const btn = this; btn.disabled = true;
    document.getElementById("loading").classList.add("show");
    try {
      const sb = getClient();
      const { data, error } = await sb.functions.invoke("Module3", {
        body: { email: email, action: "save", ueberzeugung_wahrheit: q1, ueberzeugung_hinterlassen: q2 },
      });
      if (error) throw new Error(await readFnError(error));
      if (data && data.error) throw new Error(data.error);
      document.getElementById("loading").classList.remove("show");
      okBox.innerHTML = 'Gespeichert ✅ Weiter zu <a href="modul4.html?email=' + encodeURIComponent(email) + '">Deiner Auswertung</a>';
      okBox.style.display = "block";
      okBox.scrollIntoView({ behavior:"smooth", block:"center" });
    } catch (e) {
      document.getElementById("loading").classList.remove("show");
      showError("Da ist was schiefgelaufen: " + e.message);
      btn.disabled = false;
    }
  });

  init();
})();
</script>
</body>
</html>
